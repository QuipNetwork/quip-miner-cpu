[package]
name = "quip-miner-cpu"
version = "0.3.0-rc6"
edition = "2021"
description = "CPU Ising miners: simulated annealing and single-site Gibbs (v0.3)"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/quip.network/quip-miner-cpu"
rust-version = "1.97"

[lib]
name = "quip_miner_cpu"
path = "src/lib.rs"

[[bin]]
name = "quip-cpu-sa"
path = "src/bin/quip_cpu_sa.rs"

[[bin]]
name = "quip-cpu-gibbs"
path = "src/bin/quip_cpu_gibbs.rs"

# Not feature-gated: discrete SB is the production track.
[[bin]]
name = "quip-cpu-sb"
path = "src/bin/quip_cpu_sb.rs"

# Ballistic SB. Experimental track, so this target names itself here rather than
# relying on automatic discovery under src/bin: a discovered target carries no
# required-features gate and would build on a plain cargo build.
[[bin]]
name = "quip-cpu-bsb"
path = "src/bin/quip_cpu_bsb.rs"
required-features = ["experimental"]

# Heated discrete SB. Experimental track, gated for the same reason as bsb.
[[bin]]
name = "quip-cpu-hdsb"
path = "src/bin/quip_cpu_hdsb.rs"
required-features = ["experimental"]

# Heated ballistic SB. Experimental track, gated for the same reason as bsb.
[[bin]]
name = "quip-cpu-hbsb"
path = "src/bin/quip_cpu_hbsb.rs"
required-features = ["experimental"]

# Tensor network. Experimental track, gated for the same reason as bsb.
[[bin]]
name = "quip-cpu-mps"
path = "src/bin/quip_cpu_mps.rs"
required-features = ["experimental"]

# Mean-field annealing: the same kernel pinned to bond dimension 1.
[[bin]]
name = "quip-cpu-mfa"
path = "src/bin/quip_cpu_mfa.rs"
required-features = ["experimental"]

# BP-gauged tensor network on the problem graph. Experimental track, gated
# for the same reason as bsb.
[[bin]]
name = "quip-cpu-flatiron"
path = "src/bin/quip_cpu_flatiron.rs"
required-features = ["experimental"]

# Experimental backends are developer-built only. CI tests and lints them with
# --all-features; it must never package them into release assets. The feature is
# empty because the modules compile unconditionally and only the [[bin]] targets
# are gated.
[features]
experimental = []

# Single-crate package, so lints live here rather than in [workspace.lints].
[lints.rust]
nonstandard-style     = "warn"
redundant-lifetimes   = "warn"
rust-2018-idioms      = "deny"
unreachable-pub       = "warn"
unsafe-code           = "deny"
unused-extern-crates  = "warn"
unused-imports        = "warn"
unused-must-use       = "warn"
unused-qualifications = "warn"

[lints.clippy]
panic                 = "deny"
panic-in-result-fn    = "deny"
unimplemented         = "deny"
allow-attributes      = "deny"
dbg-macro             = "warn"
todo                  = "deny"
print-stdout          = "deny"
print-stderr          = "deny"
redundant-clone       = "warn"
uninlined-format-args = "warn"
manual-string-new     = "warn"
use-self              = "warn"
await-holding-lock    = "deny"
large-futures         = "deny"
exit                  = "deny"
mem-forget            = "deny"

# Shared protocol crates live in the quip-protocol repo; tracked on its v0.3
# branch until they are published to a registry (crates.io / GitLab).
[dependencies]
quip-proto = { git = "https://gitlab.com/quip.network/quip-protocol.git", branch = "v0.3" }
quip-protocol = { git = "https://gitlab.com/quip.network/quip-protocol.git", branch = "v0.3" }
quip-miner-core = { git = "https://gitlab.com/quip.network/quip-protocol.git", branch = "v0.3" }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
proptest = "1.11.0"
quip-mock-coordinator = { git = "https://gitlab.com/quip.network/quip-protocol.git", branch = "v0.3" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync", "process"] }
