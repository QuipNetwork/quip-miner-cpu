<text x="92" y="26" font-size="15" font-weight="600" fill="#111">CPU Ising kernels on the Advantage2-System1 topology</text>
<text x="92" y="44" font-size="11" fill="#666">Zero biases, couplings drawn from {-1, +1}. 16 reads x 1000 sweeps. 30 instances per size, shared across kernels.</text>
<text x="92" y="60" font-size="11" fill="#666">cpu-gibbs occupies 4 cores per sample, the others 1. Hollow markers were measured at a 1-minute load above 20.</text>
<text x="92" y="76" font-size="11" fill="#666">cpu-mps and cpu-mfa return identical energies here: the bond budget resolves to 1 on every instance, so both run as a product state.</text>
<line x1="410.0" y1="96" x2="410.0" y2="706" stroke="#d8b98a" stroke-width="1"/>
