stages: [test, build, release]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Downloadable binaries live in the generic package registry under this name.
  PKG: quip-miner-cpu

default:
  image: rust:1.97
  tags: [linux, amd64]
  before_script:
    - apt-get update -qq && apt-get install -y -qq protobuf-compiler

cache:
  key: cargo-$CI_COMMIT_REF_SLUG
  paths: [.cargo/, target/]

test:
  stage: test
  script:
    - rustup component add clippy
    - cargo test --release
    - cargo clippy --release --all-targets -- -D warnings
    - cargo test --release --features fine-spans
    - cargo clippy --release --all-targets --features fine-spans -- -D warnings

.build:
  stage: build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

build-amd64:
  extends: .build
  script:
    - cargo build --release --bins
    - mkdir -p dist
    - cp target/release/quip-cpu-sa dist/quip-cpu-sa-amd64
    - cp target/release/quip-cpu-gibbs dist/quip-cpu-gibbs-amd64

build-arm64:
  extends: .build
  script:
    - apt-get install -y -qq gcc-aarch64-linux-gnu
    - rustup target add aarch64-unknown-linux-gnu
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
    - cargo build --release --bins --target aarch64-unknown-linux-gnu
    - mkdir -p dist
    - cp target/aarch64-unknown-linux-gnu/release/quip-cpu-sa dist/quip-cpu-sa-arm64
    - cp target/aarch64-unknown-linux-gnu/release/quip-cpu-gibbs dist/quip-cpu-gibbs-arm64

# On a tag: upload every built binary to the generic package registry, then cut
# a Release linking them as downloadable assets.
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - |
      for f in dist/*; do
        n=$(basename "$f")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}/${n}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [upload]
  before_script: []
  script:
    - |
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}"
      release-cli create --name "quip-miner-cpu ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"quip-cpu-sa-amd64\",\"url\":\"${base}/quip-cpu-sa-amd64\"}" \
        --assets-link "{\"name\":\"quip-cpu-gibbs-amd64\",\"url\":\"${base}/quip-cpu-gibbs-amd64\"}" \
        --assets-link "{\"name\":\"quip-cpu-sa-arm64\",\"url\":\"${base}/quip-cpu-sa-arm64\"}" \
        --assets-link "{\"name\":\"quip-cpu-gibbs-arm64\",\"url\":\"${base}/quip-cpu-gibbs-arm64\"}"
