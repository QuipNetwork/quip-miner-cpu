stages: [test, build, release]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Downloadable binaries live in the generic package registry under this name.
  PKG: quip-miner-cpu
  # 16 binary targets on three platforms. The build jobs read the target list
  # out of the manifest, so this number is the one place a new binary has to be
  # acknowledged by hand. Publishing a binary stays a deliberate decision.
  ASSET_COUNT: "48"

default:
  image: rust:1.97
  tags: [linux, amd64]

cache:
  key: cargo-$CI_COMMIT_REF_SLUG
  paths: [.cargo/, target/]

# Apple Silicon runners (`macos`, `arm64`) are shell executors, so the default
# `image:` does not apply and the default `before_script` (apt-get) would fail.
# Both are overridden here.
#
# The cache key is deliberately different from the Linux one. `target/` holds
# host-specific build artifacts, so sharing one key across operating systems
# poisons both caches.
.macos:
  tags: [macos, arm64]
  cache:
    key: cargo-macos-$CI_COMMIT_REF_SLUG
    paths: [.cargo/, target/]
  before_script:
    # `--no-modify-path` keeps rustup-init from appending `source $CARGO_HOME/env`
    # to the runner's shell profile. `CARGO_HOME` is inside the build directory,
    # so that line breaks every later login shell once the job is cleaned up.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --no-modify-path
    - source "$CARGO_HOME/env"

# Every build job packages the same set of binaries, so the set is read from the
# manifest rather than repeated three times. `cargo metadata` reports the
# targets Cargo actually builds, including any discovered under `src/bin`, which
# a grep of Cargo.toml cannot see.
#
# The partition check refuses a target gated behind any feature other than
# `experimental`. The classification below sorts a target by whether it carries
# a `required-features` key at all, so a target gated behind some other feature
# would fall into neither list and be dropped from `dist/` without a word.
#
# The runner wraps a job script in `set -o errexit` and `set -o pipefail`
# already, so `set -eu` below only says so locally and adds `-u`. Those two
# options are why `match` exists: grep exits 1 when it selects nothing, which
# under pipefail fails the pipeline and under errexit ends the job at a
# variable assignment, printing nothing at all. A manifest that puts every
# target on one track is legal, so absorb that status and let the checks below
# report anything genuinely wrong. A real grep error, which exits above 1,
# still stops the job.
.package-bins: &package-bins |
  set -eu
  match() { grep "$@" || [ $? = 1 ]; }
  pick() { sed -n 's/.*"name":"\([^"]*\)".*/\1/p' | LC_ALL=C sort | tr '\n' ' '; }
  meta=$(cargo metadata --no-deps --format-version 1)
  bins=$(printf '%s' "$meta" | tr '{' '\n' | match '"kind":\["bin"\]')
  prod=$(printf '%s\n' "$bins" | match -v '"required-features"' | pick)
  exp=$(printf '%s\n' "$bins" | match '"required-features":\[[^]]*"experimental"' | pick)
  all=$(printf '%s\n' "$bins" | pick)
  seen=$(printf '%s\n' $prod $exp | LC_ALL=C sort | tr '\n' ' ')
  if [ "$seen" != "$all" ]; then
    echo "a binary target is gated behind a feature other than experimental" >&2
    echo "  declared: $all" >&2
    echo "  handled:  $seen" >&2
    exit 1
  fi
  mkdir -p dist
  for b in $prod $exp; do
    cp "$BIN_DIR/$b" "dist/$b-$ASSET_SUFFIX"
  done
  # The release job needs each binary's track, which no file name carries, and
  # it runs in an image that has no cargo. It reads this table instead.
  : > bins.tsv
  for b in $prod; do printf 'production\t%s\n' "$b" >> bins.tsv; done
  for b in $exp; do printf 'experimental\t%s\n' "$b" >> bins.tsv; done
  # Check the count on every pipeline, not only on the tag pipeline that
  # publishes. A binary added to Cargo.toml has to be acknowledged in the merge
  # request that adds it, rather than breaking the release after someone has
  # already pushed the tag.
  rows=$(wc -l < bins.tsv)
  if [ "$((rows * 3))" -ne "$ASSET_COUNT" ]; then
    echo "the manifest declares $rows binaries, so a tag would publish" >&2
    echo "$((rows * 3)) assets, but ASSET_COUNT is $ASSET_COUNT." >&2
    echo "A binary target was added or removed. Update ASSET_COUNT." >&2
    exit 1
  fi

test:
  stage: test
  script:
    - rustup component add clippy rustfmt
    # Formatting is checked first: it is the cheapest job to fail and it never
    # depends on a build. Without it the tree drifts silently, because no other
    # job reads formatting.
    - cargo fmt --all -- --check
    # --all-features puts the experimental backends inside the same
    # zero-warnings gate and the same test command as the production ones.
    # Per-binary conformance coverage still differs; see tests/conformance.rs.
    - cargo test --release --all-features
    - cargo clippy --release --all-targets --all-features -- -D warnings

.build:
  stage: build
  artifacts:
    paths: [dist/, bins.tsv]
    expire_in: 1 week

# Asset names carry both the operating system and the architecture. The earlier
# scheme used the architecture alone, which cannot separate a Linux aarch64
# binary from a Darwin arm64 one. An Apple Silicon host downloaded
# `quip-cpu-sa-arm64`, received a Linux ELF, and only discovered the mismatch
# when it tried to run the file.
#
# `--all-features` builds the experimental binaries alongside the production
# ones. The feature is empty and no code reads it, so the production binaries
# keep the same instructions; only their build metadata hash changes.
build-linux-amd64:
  extends: .build
  variables:
    BIN_DIR: target/release
    ASSET_SUFFIX: linux-amd64
  script:
    - cargo build --release --bins --all-features
    - *package-bins

build-linux-arm64:
  extends: .build
  variables:
    BIN_DIR: target/aarch64-unknown-linux-gnu/release
    ASSET_SUFFIX: linux-arm64
  script:
    # The default before_script no longer runs apt-get (the protoc install is
    # gone), so the cross-compiler install updates the package index itself.
    - apt-get update -qq && apt-get install -y -qq gcc-aarch64-linux-gnu
    - rustup target add aarch64-unknown-linux-gnu
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
    - cargo build --release --bins --all-features --target aarch64-unknown-linux-gnu
    - *package-bins

# Tag only. The Apple Silicon runners are a shared and limited resource, and the
# `test` job already proves the crate compiles on every pipeline.
build-darwin-arm64:
  extends: [.build, .macos]
  variables:
    BIN_DIR: target/release
    ASSET_SUFFIX: darwin-arm64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cargo build --release --bins --all-features
    - *package-bins

# On a tag: upload every built binary to the generic package registry, then cut
# a Release linking them as downloadable assets.
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - |
      set -eu
      # Every binary must have arrived from all three build jobs. This catches a
      # build job that produced a short list; the total then catches a target
      # added to or removed from the manifest, which has to be a deliberate
      # release decision rather than an automatic one.
      for f in dist/*-linux-amd64; do
        b=$(basename "$f" -linux-amd64)
        for p in linux-arm64 darwin-arm64; do
          if [ ! -f "dist/$b-$p" ]; then
            echo "dist/$b-$p is missing: a build job did not finish" >&2
            exit 1
          fi
        done
      done
      count=$(ls dist/ | wc -l)
      if [ "$count" -ne "$ASSET_COUNT" ]; then
        echo "expected $ASSET_COUNT binaries in dist/, found ${count}." >&2
        echo "A binary target was added or removed. Update ASSET_COUNT." >&2
        ls -la dist/ >&2
        exit 1
      fi
    - |
      # --fail makes curl exit non-zero on an HTTP error, and the runner's
      # `set -o errexit` then stops the loop rather than carrying on to upload
      # the rest. Without the flag a 4xx would leave this job green and the
      # release would link an asset that resolves to nothing.
      set -eu
      for f in dist/*; do
        n=$(basename "$f")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}/${n}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  # `needs` narrows artifact download to the jobs named here, so the job that
  # writes bins.tsv has to be one of them. `upload` carries no artifacts; it
  # is named only to order this job after the files reach the registry.
  needs:
    - job: upload
      artifacts: false
    - job: build-linux-amd64
  before_script: []
  script:
    - |
      set -eu
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}"
      set -- --name "quip-miner-cpu ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}"
      # An asset name stays exactly <binary>-<os>-<arch>. `glab release
      # download` writes the asset name as the file name and matches its
      # --asset-name glob against it, so a marker here would put spaces in
      # the downloaded file name and hide the file from `quip-cpu-*-linux-amd64`.
      while IFS="$(printf '\t')" read -r track b; do
        [ -n "$b" ] || continue
        for p in linux-amd64 linux-arm64 darwin-arm64; do
          set -- "$@" --assets-link "{\"name\":\"${b}-${p}\",\"url\":\"${base}/${b}-${p}\"}"
        done
      done < bins.tsv
      # The track goes in the release notes, which costs no file name.
      prod=$(awk -F'\t' '$1=="production"{printf "%s`%s`", s, $2; s=", "}' bins.tsv)
      exp=$(awk -F'\t' '$1=="experimental"{printf "%s`%s`", s, $2; s=", "}' bins.tsv)
      desc=$(printf '%s\n\n%s\n\n%s\n' \
        "Each binary is attached for linux-amd64, linux-arm64 and darwin-arm64." \
        "Production: ${prod}" \
        "Experimental, published for evaluation and not supported for production mining: ${exp}")
      release-cli create --description "$desc" "$@"
